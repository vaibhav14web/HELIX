services:
  heliox-api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HELIX_RUNTIME_PATH=/app/data
      - HELIX_COLD_PATH=/app/data/cold
      - HELIX_LOG_PATH=/app/data/cold/logs
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
      - postgres

  qdrant:
    image: qdrant/qdrant:v1.7.0
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: helix
      POSTGRES_DB: helix
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
