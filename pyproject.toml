[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helix"
version = "2.0.0"
description = "A Context-Aware Personal Cognitive Operating System"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Vaibhav Kumar Singh"}
]

[tool.setuptools]
packages = {find = {where = ["."], include = ["user*", "foundation*", "core_ai*", "memory*", "context*", "action*", "api*", "orchestrator*", "scripts*"]}}

[project.scripts]
helix-backend = "scripts.start_backend:main"
helix-frontend = "scripts.start_frontend:main"
helix-all = "scripts.start_all:main"
helix-test = "scripts.run_tests:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
